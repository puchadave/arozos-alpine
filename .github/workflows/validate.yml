name: Validate webOwie_nodeOS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate scripts with Alpine /bin/sh
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            alpine:3.24 \
            /bin/sh -c '
              set -eu
              sh -n installer/install-webowie-nodeos.sh
              sh -n installer/install-alpine-lxc.sh
              sh -n branding/apply-branding.sh
              sh -n scripts/update-webowie-nodeos.sh
              sh -n iso/mkimg.webowie_nodeos.sh
              sh -n iso/genapkovl-webowie-nodeos.sh
              sh tests/iso-profile-smoke.sh
            '
