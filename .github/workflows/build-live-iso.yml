name: Build webOwie_nodeOS Live ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iso/**'
      - 'tests/iso-profile-smoke.sh'
      - '.github/workflows/build-live-iso.yml'

permissions:
  contents: write

concurrency:
  group: webowie-nodeos-live-iso
  cancel-in-progress: true

jobs:
  build-live-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark live ISO build running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat >/tmp/live-iso.json <<EOF
          {
            "product": "webOwie_nodeOS Live",
            "status": "running",
            "alpine": "3.24",
            "architecture": "x86_64",
            "source_commit": "$GITHUB_SHA",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "run_attempt": "$GITHUB_RUN_ATTEMPT",
            "started_at_utc": "$STARTED_AT"
          }
          EOF

          CONTENT="$(base64 -w0 /tmp/live-iso.json)"
          CURRENT_SHA="$(gh api \
            "repos/$GITHUB_REPOSITORY/contents/build/live-iso.json?ref=main" \
            --jq '.sha' 2>/dev/null || true)"

          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT \
              "repos/$GITHUB_REPOSITORY/contents/build/live-iso.json" \
              -f message="ci: mark live ISO build running" \
              -f content="$CONTENT" \
              -f sha="$CURRENT_SHA" \
              -f branch="main" >/dev/null
          else
            gh api --method PUT \
              "repos/$GITHUB_REPOSITORY/contents/build/live-iso.json" \
              -f message="ci: mark live ISO build running" \
              -f content="$CONTENT" \
              -f branch="main" >/dev/null
          fi

      - name: Validate ISO scripts
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            alpine:3.24 \
            /bin/sh -ec '
              sh -n iso/mkimg.webowie_nodeos.sh
              sh -n iso/genapkovl-webowie-nodeos.sh
              sh tests/iso-profile-smoke.sh
            '

      - name: Build Alpine 3.24 live ISO
        run: |
          mkdir -p dist

          docker run --rm --privileged \
            -v "$PWD:/repo" \
            alpine:3.24 \
            /bin/sh -ec '
              apk add --no-cache \
                alpine-sdk \
                alpine-conf \
                syslinux \
                xorriso \
                squashfs-tools \
                grub \
                mtools \
                git

              export PACKAGER="webOwie CI <build@webowie.com>"
              SUDO= abuild-keygen -a -i -n

              git clone --depth=1 --branch 3.24-stable \
                https://github.com/alpinelinux/aports.git /tmp/aports

              cp /repo/iso/mkimg.webowie_nodeos.sh \
                /tmp/aports/scripts/mkimg.webowie_nodeos.sh
              cp /repo/iso/genapkovl-webowie-nodeos.sh \
                /tmp/aports/scripts/genapkovl-webowie-nodeos.sh
              chmod 0755 /tmp/aports/scripts/genapkovl-webowie-nodeos.sh

              mkdir -p /tmp/mkimage-work /repo/dist
              cd /tmp/aports

              ./scripts/mkimage.sh \
                --tag 3.24 \
                --outdir /repo/dist \
                --workdir /tmp/mkimage-work \
                --arch x86_64 \
                --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/main \
                --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/community \
                --profile webowie_nodeos
            '

          ISO="$(find dist -maxdepth 1 -type f -name '*.iso' | head -n1)"
          test -n "$ISO"
          test -s "$ISO"
          mv "$ISO" dist/webOwie_nodeOS-live-x86_64.iso
          sha256sum dist/webOwie_nodeOS-live-x86_64.iso \
            > dist/webOwie_nodeOS-live-x86_64.iso.sha256

      - name: Install QEMU smoke-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Boot ISO and verify virtual NIC
        run: |
          set +e
          timeout 120s qemu-system-x86_64 \
            -m 1024 \
            -cdrom dist/webOwie_nodeOS-live-x86_64.iso \
            -boot d \
            -display none \
            -serial stdio \
            -monitor none \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            > qemu-live.log 2>&1
          QEMU_RC=$?
          set -e

          cat qemu-live.log
          test "$QEMU_RC" -eq 0 -o "$QEMU_RC" -eq 124
          grep -q 'Detected NIC:' qemu-live.log

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: webOwie_nodeOS-live-x86_64
          path: |
            dist/webOwie_nodeOS-live-x86_64.iso
            dist/webOwie_nodeOS-live-x86_64.iso.sha256
            qemu-live.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified live ISO release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete live-latest \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag \
            --yes 2>/dev/null || true

          gh release create live-latest \
            dist/webOwie_nodeOS-live-x86_64.iso \
            dist/webOwie_nodeOS-live-x86_64.iso.sha256 \
            qemu-live.log \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "webOwie_nodeOS Live - Alpine 3.24" \
            --notes "Single x86_64 Alpine Linux 3.24 live ISO for webOwie_nodeOS. Network support is verified by booting the generated image in QEMU with a VirtIO NIC before publication." \
            --prerelease

      - name: Record live ISO build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          FINISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if [ "$JOB_STATUS" = "success" ] && \
             [ -s dist/webOwie_nodeOS-live-x86_64.iso ] && \
             [ -s dist/webOwie_nodeOS-live-x86_64.iso.sha256 ]; then
            ISO_SHA256="$(cut -d' ' -f1 dist/webOwie_nodeOS-live-x86_64.iso.sha256)"
            ISO_SIZE="$(stat -c '%s' dist/webOwie_nodeOS-live-x86_64.iso)"
            cat >/tmp/live-iso.json <<EOF
          {
            "product": "webOwie_nodeOS Live",
            "status": "success",
            "alpine": "3.24",
            "architecture": "x86_64",
            "source_commit": "$GITHUB_SHA",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "run_attempt": "$GITHUB_RUN_ATTEMPT",
            "iso": "webOwie_nodeOS-live-x86_64.iso",
            "sha256": "$ISO_SHA256",
            "size_bytes": $ISO_SIZE,
            "qemu_virtio_network_test": "passed",
            "finished_at_utc": "$FINISHED_AT",
            "release_tag": "live-latest"
          }
          EOF
          else
            cat >/tmp/live-iso.json <<EOF
          {
            "product": "webOwie_nodeOS Live",
            "status": "failure",
            "alpine": "3.24",
            "architecture": "x86_64",
            "source_commit": "$GITHUB_SHA",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "run_attempt": "$GITHUB_RUN_ATTEMPT",
            "finished_at_utc": "$FINISHED_AT"
          }
          EOF
          fi

          CONTENT="$(base64 -w0 /tmp/live-iso.json)"
          CURRENT_SHA="$(gh api \
            "repos/$GITHUB_REPOSITORY/contents/build/live-iso.json?ref=main" \
            --jq '.sha' 2>/dev/null || true)"

          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT \
              "repos/$GITHUB_REPOSITORY/contents/build/live-iso.json" \
              -f message="ci: record live ISO build result" \
              -f content="$CONTENT" \
              -f sha="$CURRENT_SHA" \
              -f branch="main" >/dev/null
          else
            gh api --method PUT \
              "repos/$GITHUB_REPOSITORY/contents/build/live-iso.json" \
              -f message="ci: record live ISO build result" \
              -f content="$CONTENT" \
              -f branch="main" >/dev/null
          fi
