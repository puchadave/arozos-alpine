name: Build webOwie_nodeOS APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'branding/**'
      - 'scripts/build-apk.sh'
      - 'installer/install-webowie-nodeos.sh'
      - '.github/workflows/build-apk.yml'
  schedule:
    - cron: '27 4 * * *'

permissions:
  contents: write

concurrency:
  group: webowie-nodeos-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark APK build running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat >/tmp/apk-build.json <<EOF
          {
            "product": "webOwie_nodeOS",
            "artifact": "webowie-nodeos-x86_64.apk",
            "status": "running",
            "alpine": "3.24",
            "architecture": "x86_64",
            "source_commit": "$GITHUB_SHA",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "started_at_utc": "$STARTED_AT"
          }
          EOF
          CONTENT="$(base64 -w0 /tmp/apk-build.json)"
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/build/apk.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/build/apk.json" \
              -f message="ci: mark APK build running" -f content="$CONTENT" -f sha="$CURRENT_SHA" -f branch="main" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/build/apk.json" \
              -f message="ci: mark APK build running" -f content="$CONTENT" -f branch="main" >/dev/null
          fi

      - name: Validate package scripts
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            alpine:3.24 \
            /bin/sh -ec '
              sh -n scripts/build-apk.sh
              sh -n packaging/APKBUILD
              sh -n packaging/webowie-nodeos.pre-install
              sh -n packaging/webowie-nodeos.post-install
              sh -n packaging/webowie-nodeos.pre-deinstall
              sh -n packaging/webowie-nodeos.initd
              grep -q "/usr/bin/webowie-nodeos" packaging/webowie-nodeos.initd
              grep -q "/var/lib/webowie-nodeos" packaging/webowie-nodeos.initd
              ! grep -R -q "/opt/webOwie_nodeOS" packaging
            '

      - name: Build production APK
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            alpine:3.24 \
            /bin/sh scripts/build-apk.sh

      - name: Install APK in clean Alpine and verify service
        run: |
          docker run --rm --privileged \
            -v "$PWD/dist:/dist:ro" \
            alpine:3.24 \
            /bin/sh -ec '
              apk add --no-cache --allow-untrusted /dist/webowie-nodeos-x86_64.apk

              test -x /usr/bin/webowie-nodeos
              test -d /var/lib/webowie-nodeos/web
              test -d /var/lib/webowie-nodeos/system
              test -f /var/lib/webowie-nodeos/vendor-res/vendor_info.json
              test -x /etc/init.d/webowie-nodeos
              test -f /etc/conf.d/webowie-nodeos
              rc-update show default | grep -q webowie-nodeos

              mkdir -p /run/openrc
              touch /run/openrc/softlevel
              rc-service webowie-nodeos restart

              ok=0
              for i in $(seq 1 30); do
                if wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1; then
                  ok=1
                  break
                fi
                sleep 1
              done

              if [ "$ok" -ne 1 ]; then
                echo "webOwie_nodeOS failed HTTP smoke test" >&2
                cat /var/log/webowie-nodeos.log 2>/dev/null || true
                exit 1
              fi

              pgrep -f /usr/bin/webowie-nodeos >/dev/null

              apk info -L webowie-nodeos > /tmp/package-files.txt
              ! grep -Eq '(^|/)(APKBUILD|go.mod|go.sum)$' /tmp/package-files.txt
              ! grep -Eq '/usr/(local/)?src/' /tmp/package-files.txt
              ! grep -q '^opt/' /tmp/package-files.txt
            '

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webowie-nodeos-x86_64
          path: |
            dist/webowie-nodeos-x86_64.apk
            dist/webowie-nodeos-x86_64.apk.sha256
            dist/webowie-nodeos-version.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag \
            --yes 2>/dev/null || true

          gh release create apk-latest \
            dist/webowie-nodeos-x86_64.apk \
            dist/webowie-nodeos-x86_64.apk.sha256 \
            dist/webowie-nodeos-version.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "webOwie_nodeOS APK - Alpine 3.24 x86_64" \
            --notes "Production Alpine APK for webOwie_nodeOS. Runtime only; Go and make are build-time only. The package is installed into clean Alpine 3.24, OpenRC is started, and HTTP port 8080 is smoke-tested before publication."

      - name: Record APK build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          FINISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ "$JOB_STATUS" = "success" ] && [ -s dist/webowie-nodeos-x86_64.apk ]; then
            APK_SHA256="$(cut -d' ' -f1 dist/webowie-nodeos-x86_64.apk.sha256)"
            APK_SIZE="$(stat -c '%s' dist/webowie-nodeos-x86_64.apk)"
            PKGVER="$(cat dist/webowie-nodeos-version.txt)"
            cat >/tmp/apk-build.json <<EOF
          {
            "product": "webOwie_nodeOS",
            "artifact": "webowie-nodeos-x86_64.apk",
            "status": "success",
            "alpine": "3.24",
            "architecture": "x86_64",
            "package_version": "$PKGVER",
            "source_commit": "$GITHUB_SHA",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "sha256": "$APK_SHA256",
            "size_bytes": $APK_SIZE,
            "openrc_test": "passed",
            "http_8080_test": "passed",
            "release_tag": "apk-latest",
            "finished_at_utc": "$FINISHED_AT"
          }
          EOF
          else
            cat >/tmp/apk-build.json <<EOF
          {
            "product": "webOwie_nodeOS",
            "artifact": "webowie-nodeos-x86_64.apk",
            "status": "failure",
            "alpine": "3.24",
            "architecture": "x86_64",
            "source_commit": "$GITHUB_SHA",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "finished_at_utc": "$FINISHED_AT"
          }
          EOF
          fi
          CONTENT="$(base64 -w0 /tmp/apk-build.json)"
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/build/apk.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/build/apk.json" \
              -f message="ci: record APK build result" -f content="$CONTENT" -f sha="$CURRENT_SHA" -f branch="main" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/build/apk.json" \
              -f message="ci: record APK build result" -f content="$CONTENT" -f branch="main" >/dev/null
          fi
